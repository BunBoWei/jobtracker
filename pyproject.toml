[project]
name = "job-tracker"
version = "0.1.0"
description = "Local job application tracker"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "jinja2",
    "filelock",
    "uvicorn",
    "python-multipart",
]

[project.scripts]
jobtracker = "job_tracker.cli:main"

[dependency-groups]
dev = ["pytest", "httpx"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
